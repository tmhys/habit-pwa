<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>習慣グリッド</title>
<meta name="description" content="github_obsidianの習慣ログを、日付×習慣のグリッドで表示するビューア">
<meta name="theme-color" content="#4b3a8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>習慣グリッド</h1>
  <div id="updated-at" class="updated-at"></div>
</header>

<main>
  <section class="range-toggle">
    <button class="range-btn" data-days="14">2週間</button>
    <button class="range-btn active" data-days="30">1か月</button>
    <button class="range-btn" data-days="60">2か月</button>
  </section>

  <section id="grid-wrap" class="grid-wrap">
    <div id="loading" class="loading">読み込み中…</div>
  </section>

  <section id="detail" class="detail hidden"></section>

  <section class="legend">
    <span class="legend-item"><span class="cell done-sample"></span> 実施</span>
    <span class="legend-item"><span class="cell today-sample"></span> 今日</span>
    <span class="legend-item"><span class="cell"></span> 未実施</span>
  </section>

  <p class="about">
    データは <a href="https://github.com/tmhys/github_obsidian" target="_blank" rel="noopener">github_obsidian</a>
    （非公開）から、実施した日付だけを自動転載しています。日記の文章はここには含まれません。
  </p>
</main>

<script src="app.js"></script>
</body>
</html>
